name: Build & Publish Alt Player Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Project, Build & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROOT_DIR=$(pwd)
          KEYSTORE_PATH="$ROOT_DIR/altplayer-release.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -keyalg RSA -keysize 2048 -validity 10000 -alias altplayer -storepass altplayer123 -keypass altplayer123 -dname "CN=Md. Emdadul Hoque, OU=AltPlayer, O=AltPlayer, L=Chattogram, C=BD"
          fi

          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          touch .env.example

          VERSION_NAME=$(grep -E "versionName\s*=" app/build.gradle* | head -n 1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.1"; fi

          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password=altplayer123 \
              -Pandroid.injected.signing.key.alias=altplayer \
              -Pandroid.injected.signing.key.password=altplayer123
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password=altplayer123 \
              -Pandroid.injected.signing.key.alias=altplayer \
              -Pandroid.injected.signing.key.password=altplayer123
          fi

          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          FINAL_APK="$ROOT_DIR/Alt-Player-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$FINAL_APK"

          gh release delete "v${VERSION_NAME}" --yes --repo "${{ github.repository }}" || true
          gh release create "v${VERSION_NAME}" "$FINAL_APK" \
            --title "ALT PLAYER v${VERSION_NAME}" \
            --notes "Latest update for ALT PLAYER" \
            --repo "${{ github.repository }}"
