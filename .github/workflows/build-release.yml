name: Build Signed Alt Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore altplayer-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias altplayer -storepass altplayer123 -keypass altplayer123 -dname "CN=Md. Emdadul Hoque, OU=AltPlayer, O=AltPlayer, L=Chattogram, C=BD"

      - name: Locate Project & Build Signed APK
        run: |
          KEYSTORE_PATH=$(pwd)/altplayer-release.jks
          BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password=altplayer123 \
              -Pandroid.injected.signing.key.alias=altplayer \
              -Pandroid.injected.signing.key.password=altplayer123
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password=altplayer123 \
              -Pandroid.injected.signing.key.alias=altplayer \
              -Pandroid.injected.signing.key.password=altplayer123
          fi

      - name: Rename APK to Alt-Player
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          cp "$APK_PATH" "Alt-Player-v1.0.apk"

      - name: Upload Signed APK & Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Alt-Player-Release-Package
          path: |
            Alt-Player-v1.0.apk
            altplayer-release.jks
